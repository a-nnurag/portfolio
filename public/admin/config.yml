# Sveltia CMS configuration — the "write and publish" editor at /admin.
#
# Setup checklist (see CMS_SETUP.md for full steps):
#   1. Deploy this repo to Netlify.
#   2. Create a GitHub OAuth App with callback URL https://api.netlify.com/auth/done
#   3. In Netlify: Project configuration > Access & security > OAuth > Install Provider (GitHub),
#      paste the Client ID + Client Secret from step 2.
# That's it — Netlify handles the login popup itself, no separate relay to deploy.

backend:
  name: github
  repo: a-nnurag/portfolio
  branch: main
  base_url: https://api.netlify.com

# Where uploaded images are committed to, and the URL path they're served from.
media_folder: public/blog/images/uploads
public_folder: /blog/images/uploads

collections:
  - name: blog
    label: Blog Posts
    folder: src/content/blog
    create: true
    slug: '{{slug}}'
    format: frontmatter
    extension: md
    fields:
      - { label: Title, name: title, widget: string }
      - label: Publish Date
        name: date
        widget: datetime
        format: 'YYYY-MM-DD'
        date_format: 'YYYY-MM-DD'
        time_format: false
      - label: Excerpt
        name: excerpt
        widget: text
        hint: Shown on the blog card and in previews — one or two sentences.
      - { label: Cover Image, name: cover, widget: image, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - label: Draft
        name: draft
        widget: boolean
        default: false
        required: false
        hint: Hide this post from the site while you're still writing it.
      - { label: Body, name: body, widget: markdown }
